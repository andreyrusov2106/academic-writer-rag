limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_ai_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=2r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 100M;

    location / {
        root /usr/share/nginx/html;
        index academic-writer.html;
        try_files $uri $uri/ /academic-writer.html;
    }

    location = /manifest.json {
        root /usr/share/nginx/html;
        add_header Content-Type application/json;
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
    location /admin/ {
        proxy_pass http://api:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/ask {
        limit_req zone=api_ai_limit burst=5 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/ask-stream {
        limit_req zone=api_ai_limit burst=5 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/smart-action {
        limit_req zone=api_ai_limit burst=5 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/upload {
        limit_req zone=upload_limit burst=2 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://api:7860;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_no_cache $http_upgrade;
        proxy_read_timeout 90s;
    }
}
